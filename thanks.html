<style>
  :root{--ink:#0E3A46;--teal:#12808E;--aqua:#2DD4BF;--mist:#F3F6F7;--slate:#8FA6AC}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--ink);color:#fff;min-height:100vh;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;
    background-image:radial-gradient(ellipse 70% 60% at 50% 30%,rgba(45,212,191,.14),transparent 70%);-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px}
  .wordmark{display:inline-flex;align-items:center;gap:.42em;font-family:'Poppins';font-weight:600;
    font-size:1.4rem;letter-spacing:-.02em;color:#fff;text-decoration:none;margin-bottom:44px}
  .wordmark .dot{width:.55em;height:.55em;border-radius:50%;background:var(--aqua);margin-top:.12em}
  .check{width:74px;height:74px;border-radius:50%;background:var(--aqua);display:flex;align-items:center;
    justify-content:center;margin:0 auto 30px}
  .check svg{width:36px;height:36px;stroke:var(--ink);stroke-width:3;fill:none}
  h1{font-family:'Poppins';font-weight:600;font-size:clamp(2rem,5vw,2.7rem);letter-spacing:-.02em;
    line-height:1.1;text-transform:lowercase;margin-bottom:16px}
  p.lead{color:#C7D6DA;font-size:1.1rem;line-height:1.6;margin-bottom:14px}
  p.sub{color:var(--slate);font-size:.95rem;margin-bottom:36px}
  .cta{display:inline-flex;gap:.9rem;flex-wrap:wrap;justify-content:center}
  .btn{font-family:'Poppins';font-weight:500;font-size:.98rem;padding:.86em 1.6em;border-radius:100px;
    text-decoration:none;transition:transform .18s,box-shadow .18s,border-color .18s,color .18s;border:1.5px solid transparent}
  .btn-primary{background:var(--aqua);color:var(--ink)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 28px -10px rgba(45,212,191,.6)}
  .btn-ghost{border-color:rgba(255,255,255,.28);color:#fff}
  .btn-ghost:hover{border-color:var(--aqua);color:var(--aqua)}
</style>

<body>
  <div class="wrap">
    <a href="/" class="wordmark"><span class="dot"></span>alwize</a>
    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>thank you — we've got it</h1>
    <p class="lead">Your message is in. We'll be in touch within <strong>one business day</strong> — usually much sooner.</p>
    <p class="sub">In the meantime, follow along at <a href="https://instagram.com/getalwize" style="color:var(--aqua);text-decoration:none">@getalwize</a>, or reach us any time at ask@getalwize.com.</p>
    <div class="cta">
      <a href="/" class="btn btn-primary">Back to home</a>
      <a href="/#work" class="btn btn-ghost">See our work</a>
    </div>
  </div>
</body>
